apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-demo
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.demo.yaml
  - postgres.yaml
  - migrate.yaml
  - api.yaml
  - nginx.yaml
configMapGenerator:
  - name: nginx-config
    files:
      - nginx.conf
generatorOptions:
  disableNameSuffixHash: true
