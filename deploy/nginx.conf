worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    server_tokens off;
    log_format request_log '$request_id $remote_addr $request_method $uri '
                           '$status $request_time $upstream_response_time';
    access_log /dev/stdout request_log;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    limit_req_zone $binary_remote_addr zone=agent_api:1m rate=1r/s;
    limit_req_status 429;

    server {
        listen 8080;
        client_max_body_size 16k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Request-ID $request_id always;
        proxy_hide_header X-Request-ID;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        # Probes do not consume the per-client request budget.
        location = /health { proxy_pass http://api:8080; }
        location = /ready { proxy_pass http://api:8080; }
        location /v1/ {
            limit_req zone=agent_api burst=3 nodelay;
            error_page 429 = @rate_limited;
            proxy_pass http://api:8080;
        }
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"proxy_rate_limited","message":"Too many requests. Try again later."}}';
        }
        location / {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Unknown endpoint."}}';
        }
    }
}
