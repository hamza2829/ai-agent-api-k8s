# Public example credentials for fake, disposable demo data only.
# Kubernetes Secrets are base64 encoded, not encrypted by this manifest.
apiVersion: v1
kind: Secret
metadata:
  name: demo-secrets
  namespace: agent-demo
type: Opaque
stringData:
  api-key: demo-only-key-change-me-123456
  postgres-password: demo-postgres-password
  read-db-password: read_password
  database-url: postgresql+psycopg://agent_reader:read_password@postgres:5432/customer_demo
  admin-database-url: postgresql+psycopg://postgres:demo-postgres-password@postgres:5432/customer_demo
