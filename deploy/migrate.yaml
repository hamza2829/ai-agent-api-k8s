apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: agent-demo
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ai-agent-api-k8s:ci
          imagePullPolicy: Never
          command: [python, -m, agent_api.migrate, --demo-bootstrap]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: demo-secrets
                  key: admin-database-url
            - name: READ_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-secrets
                  key: read-db-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
