[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-api-k8s"
version = "0.1.0"
description = "Read-only customer API, constrained agent tools and a Kubernetes learning deployment"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "SQLAlchemy==2.1.6", "psycopg[binary]==3.3.6", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: requires actual PostgreSQL via TEST_DATABASE_URL"]
